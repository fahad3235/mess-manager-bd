<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mess Manager BD</title>
<style>
:root{
  --bg:#f2f5f4; --card:#ffffff; --ink:#1d2422; --muted:#6b7672;
  --primary:#0e6e5c; --primary-d:#0a5547; --accent:#e8a13d;
  --danger:#c0392b; --line:#e2e8e6; --radius:12px;
}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);line-height:1.45}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--primary);color:#fff;padding:12px 16px;position:sticky;top:0;z-index:20}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:40px;height:40px;border-radius:10px;background:#fff;color:var(--primary);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px}
.brand h1{margin:0;font-size:19px}
.brand p{margin:0;font-size:12px;opacity:.85}
.lang-btn{background:#fff;color:var(--primary);border:0;border-radius:999px;padding:8px 16px;font-weight:700;cursor:pointer;font-size:14px}
.banner{background:#fff3cd;color:#7a5b00;padding:10px 16px;font-size:14px;border-bottom:1px solid #f0dfa0}
.tabs{display:flex;gap:4px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:64px;z-index:15;overflow-x:auto;padding:0 8px}
.tab{border:0;background:none;padding:12px 14px;font-size:14px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap;border-bottom:3px solid transparent}
.tab.active{color:var(--primary);border-bottom-color:var(--primary)}
main{max-width:860px;margin:0 auto;padding:16px 12px 40px}
.tabpane{display:none}
.tabpane.active{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:12px}
h2{font-size:17px;margin:6px 0 10px}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
input[type=text],input[type=date],input[type=number]{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;font-size:15px;background:#fff;color:var(--ink)}
input:focus{outline:2px solid var(--primary);outline-offset:0;border-color:var(--primary)}
.btn{border:0;border-radius:8px;padding:10px 18px;font-size:15px;font-weight:700;cursor:pointer;background:#dfe7e4;color:var(--ink);margin-top:10px}
.btn.primary{background:var(--primary);color:#fff}
.btn.primary:hover{background:var(--primary-d)}
.btn.danger{background:var(--danger);color:#fff}
.btn.small{padding:6px 10px;font-size:13px;margin-top:0}
.err{background:#fdecea;color:#8f1d12;border:1px solid #f5c6bd;border-radius:8px;padding:8px 12px;font-size:14px;margin-top:10px}
.okmsg{background:#e6f6ef;color:#0a5547;border:1px solid #bfe6d2;border-radius:8px;padding:8px 12px;font-size:14px;margin-top:10px}
.muted{color:var(--muted);font-size:13px}
.empty{background:#fff;border:1px dashed var(--line);border-radius:var(--radius);padding:22px;text-align:center;color:var(--muted);font-size:14px;margin-bottom:12px}
.rate-hero{background:linear-gradient(135deg,var(--primary),#149a7d);color:#fff;border-radius:var(--radius);padding:20px;margin-bottom:12px;text-align:center}
.rate-label{font-size:14px;opacity:.9}
.rate-value{font-size:38px;font-weight:800;margin:4px 0}
.rate-sub{font-size:13px;opacity:.9}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px}
@media(min-width:640px){.stats{grid-template-columns:repeat(3,1fr)}}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px}
.stat .k{font-size:12px;color:var(--muted)}
.stat .v{font-size:20px;font-weight:800;margin-top:2px;overflow-wrap:anywhere}
.table-wrap{overflow-x:auto;background:#fff;border:1px solid var(--line);border-radius:var(--radius)}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:560px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{background:#f7faf9;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.04em}
tr:last-child td{border-bottom:0}
td.num{text-align:right;font-variant-numeric:tabular-nums}
th.num{text-align:right}
.badge{display:inline-block;font-size:11px;font-weight:700;border-radius:999px;padding:2px 10px;margin-left:6px}
.badge.owes{background:#fdecea;color:#8f1d12}
.badge.gets{background:#e6f6ef;color:#0a5547}
.badge.settled{background:#eef1f0;color:var(--muted)}
.meal-row{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px;margin-bottom:8px}
.meal-row .nm{flex:1;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:#f7faf9;font-size:18px;font-weight:700;cursor:pointer;color:var(--primary)}
.stepper .val{min-width:26px;text-align:center;font-weight:800;font-size:16px}
.stepper .sl{font-size:11px;color:var(--muted);width:100%;text-align:center}
.step-group{display:flex;flex-direction:column;align-items:center}
.exp-row{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px;margin-bottom:8px}
.exp-row .dt{font-size:13px;color:var(--muted);white-space:nowrap}
.exp-row .nt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;font-size:14px}
.exp-row .am{font-weight:800;white-space:nowrap}
.member-row{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px;margin-bottom:8px}
.member-row .nm{flex:1;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis}
.member-row .ad{font-size:13px;color:var(--muted);white-space:nowrap}
.switch{position:relative;width:44px;height:24px;flex:none}
.switch input{opacity:0;width:100%;height:100%;position:absolute;margin:0;cursor:pointer}
.knob{position:absolute;inset:0;background:#cfd8d5;border-radius:999px;transition:.15s}
.knob:after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.15s}
.switch input:checked + .knob{background:var(--primary)}
.switch input:checked + .knob:after{left:23px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
footer{max-width:860px;margin:0 auto;padding:0 12px 32px;color:var(--muted);font-size:12px;text-align:center}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal[hidden]{display:none}
.modal-box{background:#fff;border-radius:var(--radius);padding:20px;max-width:420px;width:100%}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;background:#1d2422;color:#fff;border-radius:999px;padding:10px 22px;font-size:14px;z-index:60;box-shadow:0 4px 18px rgba(0,0,0,.25)}
.toast[hidden]{display:none}
.daytotal{font-size:15px;font-weight:700;margin-top:10px}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="logo">MM</span>
    <div><h1 id="appTitle">Mess Manager BD</h1><p id="appTagline"></p></div>
  </div>
  <button id="langBtn" class="lang-btn" type="button">BN</button>
</header>
<div id="corruptBanner" class="banner" hidden></div>
<nav class="tabs" id="tabNav">
  <button class="tab active" data-tab="dashboard" type="button"><span data-i18n="tabDashboard">Dashboard</span></button>
  <button class="tab" data-tab="meals" type="button"><span data-i18n="tabMeals">Meals</span></button>
  <button class="tab" data-tab="members" type="button"><span data-i18n="tabMembers">Members</span></button>
  <button class="tab" data-tab="bazaar" type="button"><span data-i18n="tabBazaar">Bazaar</span></button>
  <button class="tab" data-tab="data" type="button"><span data-i18n="tabData">Data</span></button>
</nav>
<main>
  <section id="tab-dashboard" class="tabpane active">
    <div class="rate-hero">
      <div class="rate-label" data-i18n="rateHeroTitle">Current meal rate</div>
      <div class="rate-value" id="rateHero">-</div>
      <div class="rate-sub" id="rateSub"></div>
    </div>
    <div class="stats" id="statCards"></div>
    <h2 data-i18n="billTableTitle">Member bills</h2>
    <p class="muted" data-i18n="sortedNote"></p>
    <div class="table-wrap" id="billWrap">
      <table id="billTable">
        <thead><tr>
          <th data-i18n="colName">Name</th><th class="num" data-i18n="colMeals">Meals</th>
          <th class="num" data-i18n="colBill">Bill</th><th class="num" data-i18n="colAdvance">Advance</th>
          <th class="num" data-i18n="colBalance">Balance</th>
        </tr></thead>
        <tbody id="billBody"></tbody>
      </table>
    </div>
    <div id="dashEmpty" class="empty" hidden></div>
  </section>

  <section id="tab-meals" class="tabpane">
    <div class="card">
      <div class="row">
        <div style="flex:1;min-width:180px">
          <label data-i18n="mealDate" for="mealDate">Date</label>
          <input type="date" id="mealDate">
        </div>
        <div><label>&nbsp;</label><button id="todayBtn" class="btn small" type="button"></button></div>
      </div>
      <div class="daytotal"><span data-i18n="dayTotal">Day total</span>: <span id="dayTotalVal">0</span></div>
      <p class="muted" data-i18n="emptyMealsHint"></p>
    </div>
    <div id="mealRows"></div>
    <div id="mealsEmpty" class="empty" hidden></div>
    <button id="saveMeals" class="btn primary" type="button"></button>
  </section>

  <section id="tab-members" class="tabpane">
    <div class="card">
      <h2 data-i18n="addMember">Add member</h2>
      <label data-i18n="memberName" for="mName">Name</label>
      <input type="text" id="mName" maxlength="60" autocomplete="off">
      <label data-i18n="advanceBDT" for="mAdvance">Advance (BDT)</label>
      <input type="text" id="mAdvance" inputmode="decimal" placeholder="0" autocomplete="off">
      <div class="err" id="mErr" hidden></div>
      <button id="mAdd" class="btn primary" type="button"><span data-i18n="add">Add</span></button>
    </div>
    <div id="memberList"></div>
    <div id="membersEmpty" class="empty" hidden></div>
    <p class="muted" data-i18n="mealsExcludedNote"></p>
  </section>

  <section id="tab-bazaar" class="tabpane">
    <div class="card">
      <h2 data-i18n="addExpense">Add bazaar expense</h2>
      <label data-i18n="expenseDate" for="eDate">Date</label>
      <input type="date" id="eDate">
      <label data-i18n="note" for="eNote">Note (optional)</label>
      <input type="text" id="eNote" maxlength="120" autocomplete="off">
      <label data-i18n="amountBDT" for="eAmount">Amount (BDT)</label>
      <input type="text" id="eAmount" inputmode="decimal" autocomplete="off">
      <div class="err" id="eErr" hidden></div>
      <button id="eAdd" class="btn primary" type="button"><span data-i18n="add">Add</span></button>
    </div>
    <div class="card"><span data-i18n="monthlyTotal">This month</span>: <b id="monthTotal"></b></div>
    <h2 data-i18n="expenseListTitle">Expenses (newest first)</h2>
    <div id="expenseList"></div>
    <div id="bazaarEmpty" class="empty" hidden></div>
  </section>

  <section id="tab-data" class="tabpane">
    <div class="card">
      <p data-i18n="dataExplainer"></p>
      <button id="expBtn" class="btn" type="button"><span data-i18n="exportJson">Export JSON</span></button>
      <div class="row" style="margin-top:10px">
        <input type="file" id="impFile" accept="application/json" style="flex:1;min-width:200px">
        <button id="impBtn" class="btn" type="button"><span data-i18n="importJson">Import JSON</span></button>
      </div>
      <div class="muted" data-i18n="importFileLabel" style="margin-top:6px"></div>
      <div class="err" id="dErr" hidden></div>
      <div class="okmsg" id="dOk" hidden></div>
      <hr style="border:0;border-top:1px solid var(--line);margin:16px 0">
      <button id="clearBtn" class="btn danger" type="button"><span data-i18n="clearAll">Erase all data</span></button>
    </div>
  </section>
</main>
<footer><p data-i18n="disclaimer"></p></footer>

<div id="modal" class="modal" hidden>
  <div class="modal-box">
    <p id="modalMsg"></p>
    <div class="row" style="justify-content:flex-end">
      <button id="modalCancel" class="btn" type="button"></button>
      <button id="modalOk" class="btn danger" type="button"></button>
    </div>
  </div>
</div>
<div id="toast" class="toast" hidden></div>

<script src="logic.js"></script>
<script>
(function () {
"use strict";
var M = window.MessManager;
var qs = new URLSearchParams(location.search);
var ASOF = qs.get("asof") || null; // test override for "today"
function refToday() { return ASOF || M.todayISO(); }

var state, wasCorrupt;
function load() { var r = M.loadState(); state = r.state; wasCorrupt = r.corrupt; }
function save() { M.saveState(state); }

function lang() { return state.settings.lang; }
function T(key, params) { return M.t(lang(), key, params); }
function esc(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;")
    .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}
function money(p) { return M.fmtMoney(p, lang()); }
function num(n) { return lang() === "bn" ? M.bnDigits(String(n)) : String(n); }
function $(id) { return document.getElementById(id); }

/* ---------- toast + modal ---------- */
var toastTimer = null;
function toast(msg) {
  var el = $("toast");
  el.textContent = msg; el.hidden = false;
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { el.hidden = true; }, 2200);
}
function showConfirm(msg) {
  return new Promise(function (resolve) {
    $("modalMsg").textContent = msg;
    $("modalOk").textContent = T("confirm");
    $("modalCancel").textContent = T("cancel");
    $("modal").hidden = false;
    function done(v) {
      $("modal").hidden = true;
      $("modalOk").onclick = $("modalCancel").onclick = null;
      resolve(v);
    }
    $("modalOk").onclick = function () { done(true); };
    $("modalCancel").onclick = function () { done(false); };
  });
}

/* ---------- language ---------- */
var BN_LABEL = ""; // set in applyLang()
function applyLang() {
  BN_LABEL = "\u09AC\u09BE\u0982\u09B2\u09BE"; // Bengali (escaped for ASCII purity)
  document.querySelectorAll("[data-i18n]").forEach(function (el) {
    el.textContent = T(el.getAttribute("data-i18n"));
  });
  document.title = T("appTitle");
  document.documentElement.lang = lang() === "bn" ? "bn" : "en";
  $("appTitle").textContent = T("appTitle");
  $("appTagline").textContent = T("appTagline");
  $("langBtn").textContent = lang() === "en" ? BN_LABEL : "EN";
  $("saveMeals").textContent = T("saveMeals");
  $("todayBtn").textContent = T("today");
  if (wasCorrupt) {
    var b = $("corruptBanner");
    b.textContent = T("corruptNotice"); b.hidden = false;
  }
}
function toggleLang() {
  state.settings.lang = lang() === "en" ? "bn" : "en";
  save(); applyLang(); renderAll();
}

/* ---------- tabs ---------- */
function switchTab(name) {
  document.querySelectorAll("#tabNav .tab").forEach(function (b) {
    b.classList.toggle("active", b.getAttribute("data-tab") === name);
  });
  document.querySelectorAll(".tabpane").forEach(function (s) {
    s.classList.toggle("active", s.id === "tab-" + name);
  });
}

/* ---------- dashboard ---------- */
function renderDashboard() {
  var tm = M.totalMeals(state), tc = M.totalCost(state), rate = M.mealRatePaisa(state);
  var adv = M.totalAdvances(state), net = M.netBalance(state);
  $("rateHero").textContent = rate == null ? T("noRate") : money(Math.round(rate));
  $("rateSub").textContent = rate == null ? T("noMealsYet")
    : T("perMeal") + "  |  " + T("mealsUnit", { n: num(tm) }) + "  |  " + money(tc);
  var cards = [
    [T("statMembers"), num(state.members.length)],
    [T("statMeals"), num(tm)],
    [T("statBazaar"), money(tc)],
    [T("statRate"), rate == null ? T("noRate") : money(Math.round(rate))],
    [T("statAdvances"), money(adv)],
    [T("statNet"), money(net)]
  ];
  $("statCards").innerHTML = cards.map(function (c) {
    return '<div class="stat"><div class="k">' + esc(c[0]) + '</div><div class="v">' + esc(c[1]) + "</div></div>";
  }).join("");
  var rows = M.billSummary(state);
  $("dashEmpty").hidden = rows.length > 0;
  $("billWrap").style.display = rows.length ? "" : "none";
  if (!rows.length) $("dashEmpty").textContent = T("emptyDashboard");
  $("billBody").innerHTML = rows.map(function (r) {
    var badge, cls;
    if (r.balance < 0) { badge = T("badgeOwes"); cls = "owes"; }
    else if (r.balance > 0) { badge = T("badgeGets"); cls = "gets"; }
    else { badge = T("badgeSettled"); cls = "settled"; }
    var nm = esc(r.name) + (r.active ? "" : ' <span class="muted">(' + esc(T("inactive")) + ")</span>");
    return "<tr><td>" + nm + "</td>" +
      '<td class="num">' + esc(num(r.meals)) + "</td>" +
      '<td class="num">' + esc(money(r.bill)) + "</td>" +
      '<td class="num">' + esc(money(r.advance)) + "</td>" +
      '<td class="num">' + esc(money(r.balance)) +
      '<span class="badge ' + cls + '">' + esc(badge) + "</span></td></tr>";
  }).join("");
}

/* ---------- meals ---------- */
var mealDate = null, draft = {};
function loadDraft() {
  draft = {};
  var day = M.getDayMeals(state, mealDate);
  state.members.forEach(function (m) {
    if (!m.active) return;
    var e = day[m.id];
    draft[m.id] = { lunch: e ? e.lunch : 0, dinner: e ? e.dinner : 0 };
  });
}
function renderMeals() {
  if (!mealDate) { mealDate = refToday(); loadDraft(); }
  var inp = $("mealDate");
  inp.value = mealDate; inp.max = refToday();
  var ids = Object.keys(draft);
  $("mealsEmpty").hidden = ids.length > 0;
  $("saveMeals").style.display = ids.length ? "" : "none";
  if (!ids.length) $("mealsEmpty").textContent = T("emptyMembers");
  $("mealRows").innerHTML = ids.map(function (id) {
    var m = M.findMember(state, id);
    if (!m) return "";
    var d = draft[id];
    function stepper(slot, label) {
      return '<div class="step-group"><div class="stepper">' +
        '<button type="button" data-act="dec" data-mid="' + id + '" data-slot="' + slot + '" aria-label="-">-</button>' +
        '<span class="val" id="v-' + slot + "-" + id + '">' + num(d[slot]) + "</span>" +
        '<button type="button" data-act="inc" data-mid="' + id + '" data-slot="' + slot + '" aria-label="+">+</button>' +
        '</div><div class="sl">' + esc(label) + "</div></div>";
    }
    return '<div class="meal-row"><div class="nm">' + esc(m.name) + "</div>" +
      stepper("lunch", T("lunch")) + stepper("dinner", T("dinner")) + "</div>";
  }).join("");
  updateDayTotal();
}
function updateDayTotal() {
  var t = 0;
  Object.keys(draft).forEach(function (id) { t += draft[id].lunch + draft[id].dinner; });
  $("dayTotalVal").textContent = num(t);
}
function step(mid, slot, dir) {
  var d = draft[mid];
  if (!d) return;
  var v = d[slot] + dir;
  if (v < 0 || v > M.MAX_MEAL_SLOT) return;
  d[slot] = v;
  var el = $("v-" + slot + "-" + mid);
  if (el) el.textContent = num(v);
  updateDayTotal();
}
function saveMeals() {
  var errs = [];
  Object.keys(draft).forEach(function (id) {
    var r = M.setMeals(state, mealDate, id, draft[id].lunch, draft[id].dinner, refToday());
    if (!r.ok) errs.push(r.err);
  });
  if (errs.length) { toast(T(errs[0])); return; }
  save(); loadDraft(); renderMeals(); renderDashboard();
  toast(T("mealsSaved"));
}

/* ---------- members ---------- */
var editingId = null;
function fieldErr(el, key, params) {
  if (!key) { el.hidden = true; el.textContent = ""; return; }
  el.textContent = T(key, params); el.hidden = false;
}
function addMemberFromForm() {
  var name = $("mName").value;
  var pr = M.parseBDT($("mAdvance").value.trim() === "" ? "0" : $("mAdvance").value, M.MAX_ADVANCE_BDT);
  if (!pr.ok) {
    fieldErr($("mErr"), pr.err === "max" ? "errAdvanceMax" : (pr.err === "neg" ? "errAdvanceNeg" : "errAdvanceBad"),
      { max: M.MAX_ADVANCE_BDT });
    return;
  }
  var r = M.addMember(state, name, pr.paisa);
  if (!r.ok) { fieldErr($("mErr"), r.err, { max: M.MAX_NAME_LEN }); return; }
  fieldErr($("mErr"), null);
  $("mName").value = ""; $("mAdvance").value = "";
  save(); editingId = null; renderMembers(); renderMeals(); renderDashboard();
  toast(T("memberAdded"));
}
function renderMembers() {
  var list = $("memberList");
  $("membersEmpty").hidden = state.members.length > 0;
  if (!state.members.length) $("membersEmpty").textContent = T("emptyMembers");
  list.innerHTML = state.members.map(function (m) {
    if (editingId === m.id) {
      return '<div class="member-row"><div style="flex:1">' +
        '<input type="text" id="editName" maxlength="60" value="' + esc(m.name) + '">' +
        '<input type="text" id="editAdv" inputmode="decimal" value="' + (m.advancePaisa / 100) + '" style="margin-top:6px">' +
        '<div class="err" id="editErr" hidden></div></div>' +
        '<button class="btn small primary" type="button" data-act="edit-save" data-mid="' + m.id + '">' + esc(T("save")) + "</button>" +
        '<button class="btn small" type="button" data-act="edit-cancel">' + esc(T("cancel")) + "</button></div>";
    }
    return '<div class="member-row">' +
      '<label class="switch" title="' + esc(T("toggleActiveTitle")) + '">' +
      '<input type="checkbox" data-act="toggle" data-mid="' + m.id + '"' + (m.active ? " checked" : "") + '><span class="knob"></span></label>' +
      '<div class="nm">' + esc(m.name) +
      '<div class="ad">' + esc(T("advanceBDT")) + ": " + esc(money(m.advancePaisa)) +
      " | " + esc(m.active ? T("active") : T("inactive")) + "</div></div>" +
      '<button class="btn small" type="button" data-act="edit" data-mid="' + m.id + '" title="' + esc(T("editTitle")) + '">' + esc(T("edit")) + "</button>" +
      '<button class="btn small danger" type="button" data-act="del-member" data-mid="' + m.id + '" title="' + esc(T("deleteTitle")) + '">' + esc(T("del")) + "</button></div>";
  }).join("");
}

/* ---------- bazaar ---------- */
function addExpenseFromForm() {
  var date = $("eDate").value;
  var derr = M.validateDate(date, refToday());
  if (derr) { fieldErr($("eErr"), derr); return; }
  var pr = M.parseBDT($("eAmount").value, M.MAX_EXPENSE_BDT);
  if (!pr.ok || pr.paisa <= 0) {
    fieldErr($("eErr"), !pr.ok ? (pr.err === "max" ? "errAmountMax" : (pr.err === "neg" ? "errAmountPos" : "errAmountBad")) : "errAmountPos",
      { max: M.MAX_EXPENSE_BDT });
    return;
  }
  var r = M.addExpense(state, date, $("eNote").value, pr.paisa, refToday());
  if (!r.ok) { fieldErr($("eErr"), r.err, { max: M.MAX_NOTE_LEN }); return; }
  fieldErr($("eErr"), null);
  $("eNote").value = ""; $("eAmount").value = "";
  save(); renderBazaar(); renderDashboard();
  toast(T("expenseAdded"));
}
function renderBazaar() {
  var inp = $("eDate");
  if (!inp.value) inp.value = refToday();
  inp.max = refToday();
  $("monthTotal").textContent = money(M.monthlyTotal(state, refToday().slice(0, 7)));
  var rows = M.expensesSorted(state);
  $("bazaarEmpty").hidden = rows.length > 0;
  if (!rows.length) $("bazaarEmpty").textContent = T("emptyBazaar");
  $("expenseList").innerHTML = rows.map(function (e) {
    return '<div class="exp-row"><div class="dt">' + esc(num(e.date)) + "</div>" +
      '<div class="nt">' + (e.note ? esc(e.note) : '<span class="muted">-</span>') + "</div>" +
      '<div class="am">' + esc(money(e.amountPaisa)) + "</div>" +
      '<button class="btn small danger" type="button" data-act="del-expense" data-eid="' + e.id + '" title="' + esc(T("deleteTitle")) + '">' + esc(T("del")) + "</button></div>";
  }).join("");
}

/* ---------- data ---------- */
function doExport() {
  var json = M.exportJSON(state);
  window.__lastExport = json;
  try {
    var blob = new Blob([json], { type: "application/json" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "mess-manager-bd-backup.json";
    document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  } catch (e) { /* headless/test environments: __lastExport still set */ }
  return json;
}
function dataMsg(ok, key) {
  var e = $("dErr"), o = $("dOk");
  if (ok) { e.hidden = true; o.textContent = T(key); o.hidden = false; }
  else { o.hidden = true; e.textContent = T(key); e.hidden = false; }
}
function doImportText(text) {
  var r = M.importJSON(text);
  if (!r.ok) { dataMsg(false, "importFail"); return false; }
  state = r.state; save();
  mealDate = null; editingId = null;
  applyLang(); renderAll();
  dataMsg(true, "importOk");
  return true;
}

/* ---------- render all ---------- */
function renderAll() {
  renderDashboard(); renderMeals(); renderMembers(); renderBazaar();
}

/* ---------- events ---------- */
function bind() {
  $("tabNav").addEventListener("click", function (ev) {
    var b = ev.target.closest("[data-tab]");
    if (b) switchTab(b.getAttribute("data-tab"));
  });
  $("langBtn").addEventListener("click", toggleLang);
  $("mealDate").addEventListener("change", function () {
    var derr = M.validateDate($("mealDate").value, refToday());
    if (derr) { toast(T(derr)); $("mealDate").value = mealDate; return; }
    mealDate = $("mealDate").value; loadDraft(); renderMeals();
  });
  $("todayBtn").addEventListener("click", function () {
    mealDate = refToday(); loadDraft(); renderMeals();
  });
  $("saveMeals").addEventListener("click", saveMeals);
  document.addEventListener("click", function (ev) {
    var b = ev.target.closest("[data-act]");
    if (!b) return;
    var act = b.getAttribute("data-act"), mid = b.getAttribute("data-mid");
    if (act === "inc" || act === "dec") step(mid, b.getAttribute("data-slot"), act === "inc" ? 1 : -1);
    else if (act === "del-member") {
      showConfirm(T("confirmDeleteMember")).then(function (yes) {
        if (!yes) return;
        M.deleteMember(state, mid); save();
        if (editingId === mid) editingId = null;
        loadDraft(); renderMembers(); renderMeals(); renderDashboard();
        toast(T("memberDeleted"));
      });
    }
    else if (act === "edit") { editingId = mid; renderMembers(); }
    else if (act === "edit-cancel") { editingId = null; renderMembers(); }
    else if (act === "edit-save") {
      var nm = $("editName").value;
      var pr = M.parseBDT($("editAdv").value.trim() === "" ? "0" : $("editAdv").value, M.MAX_ADVANCE_BDT);
      if (!pr.ok) {
        fieldErr($("editErr"), pr.err === "max" ? "errAdvanceMax" : (pr.err === "neg" ? "errAdvanceNeg" : "errAdvanceBad"), { max: M.MAX_ADVANCE_BDT });
        return;
      }
      var r = M.editMember(state, mid, nm, pr.paisa);
      if (!r.ok) { fieldErr($("editErr"), r.err, { max: M.MAX_NAME_LEN }); return; }
      editingId = null; save(); renderMembers(); renderDashboard();
      toast(T("memberUpdated"));
    }
    else if (act === "del-expense") {
      var eid = b.getAttribute("data-eid");
      showConfirm(T("confirmDeleteExpense")).then(function (yes) {
        if (!yes) return;
        M.deleteExpense(state, eid); save(); renderBazaar(); renderDashboard();
        toast(T("expenseDeleted"));
      });
    }
  });
  document.addEventListener("change", function (ev) {
    var t = ev.target;
    if (t.getAttribute && t.getAttribute("data-act") === "toggle") {
      M.setMemberActive(state, t.getAttribute("data-mid"), t.checked);
      save(); loadDraft(); renderMembers(); renderMeals(); renderDashboard();
    }
  });
  $("mAdd").addEventListener("click", addMemberFromForm);
  $("mName").addEventListener("keydown", function (ev) { if (ev.key === "Enter") addMemberFromForm(); });
  $("eAdd").addEventListener("click", addExpenseFromForm);
  $("expBtn").addEventListener("click", doExport);
  $("impBtn").addEventListener("click", function () {
    var f = $("impFile").files[0];
    if (!f) { dataMsg(false, "importFail"); return; }
    var rd = new FileReader();
    rd.onload = function () { doImportText(String(rd.result)); };
    rd.readAsText(f);
  });
  $("clearBtn").addEventListener("click", function () {
    showConfirm(T("confirmClearAll")).then(function (yes) {
      if (!yes) return;
      var l = lang();
      state = M.blankState(); state.settings.lang = l;
      save(); mealDate = null; editingId = null;
      applyLang(); renderAll();
      toast(T("allCleared"));
    });
  });
}

/* ---------- init ---------- */
load();
applyLang();
bind();
renderAll();
window.__mm = { getState: function () { return state; }, asof: ASOF, version: 1 };
window.__importText = doImportText;
window.__lastExport = null;
})();
</script>
</body>
</html>
